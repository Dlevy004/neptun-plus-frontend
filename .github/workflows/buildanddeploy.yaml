name: buildanddeploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Docker Tag
        run: |
          REPOSITORY=$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "DOCKER_TAG=ghcr.io/${REPOSITORY}-${BRANCH}:${SHORT_SHA}" >> $GITHUB_ENV

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.DOCKER_TAG }}

      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          SERVICE_NAME: neptun-plus-frontend
          IMAGE: ${{ env.DOCKER_TAG }}
        run: |
          gh workflow run deploy.yaml \
            --repo szabobalazs2003/fejlettszoftver-argo \
            --ref main \
            -f service="$SERVICE_NAME" \
            -f image="$IMAGE"